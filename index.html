<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR บนกระดาษ - ตัวอย่าง</title>

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!--
    model.glb ไฟล์ปัจจุบันไม่มีแอนิเมชัน (animations: 0) จึงไม่ต้องโหลด aframe-extras
    ซึ่งหนักถึง ~1.7 MB ถ้าวันหลังเปลี่ยนไปใช้โมเดลที่มีแอนิเมชัน ให้เปิดบรรทัดล่างนี้
    แล้วใส่ attribute animation-mixer กลับเข้าไปที่ <a-gltf-model>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /*
      สำคัญ: ใส่พื้นหลังดำที่ <html> เท่านั้น ห้ามใส่ที่ <body>
      MindAR แทรก <video> เป็นลูกของ body ด้วย z-index: -2 ตามลำดับการวาดของ CSS
      พื้นหลังของ html จะถูกวาดเป็นพื้นหลังของ canvas (ล่างสุด) แต่พื้นหลังของ body
      เป็นกล่องปกติที่วาด "ทับ" ชั้น z-index ติดลบ — ถ้าใส่ที่ body ภาพกล้องจะโดนบังจนจอดำ
    */
    html {
      background: #000;
    }

    #arContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* ----- overlay UI ----- */
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: linear-gradient(160deg, #101418 0%, #1c2530 100%);
      color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      box-sizing: border-box;
    }

    #startScreen h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 12px;
    }

    #startScreen p {
      font-size: 15px;
      line-height: 1.6;
      color: #b9c2cc;
      max-width: 320px;
      margin: 0 0 28px;
    }

    #startBtn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #startBtn:active { transform: scale(0.97); }

    #version {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #5a6572;
      letter-spacing: 0.5px;
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
      backdrop-filter: blur(4px);
    }

    #foundBadge {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(34,197,94,0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <!-- หน้าจอเริ่มต้น: ขอสิทธิ์กล้องหลังผู้ใช้กดปุ่ม (จำเป็นสำหรับ iOS Safari) -->
  <div id="startScreen">
    <h1>ส่องกล้องไปที่กระดาษ</h1>
    <p>
      แตะปุ่มด้านล่างเพื่อเปิดกล้อง แล้วเล็งกล้องไปที่ภาพที่พิมพ์ไว้บนกระดาษ
      โมเดล 3D จะปรากฏขึ้นมาบนกระดาษโดยอัตโนมัติ
    </p>
    <button id="startBtn">เปิดกล้อง</button>
    <!-- ป้ายเวอร์ชัน ใช้ยืนยันว่าเครื่องโหลดไฟล์ใหม่แล้วจริง ไม่ได้ติดแคชเก่า -->
    <div id="version">assets v3</div>
  </div>

  <div id="hint">กำลังมองหาภาพบนกระดาษ...</div>
  <div id="foundBadge">พบภาพแล้ว ✓</div>

  <!--
    MindAR แทรก <video> เข้าไปใน parentNode ของ <a-scene> และใช้ขนาดของกล่องนี้
    คำนวณการครอปภาพกล้อง จึงต้องมี div ครอบที่กำหนดขนาดชัดเจนและพื้นหลังโปร่งใส
  -->
  <div id="arContainer">
  <!--
    filterMinCF / filterBeta คือค่าของ OneEuroFilter ที่ MindAR ใช้หน่วงการสั่น
    ใช้ค่าเริ่มต้นของ MindAR (0.001 / 1000) เพราะทดสอบแล้วว่าการเพิ่ม filterMinCF
    ทำให้โมเดลสั่นตลอดเวลา
      โมเดลสั่นยิบๆ -> ลด filterMinCF (เช่น 0.0005)
      โมเดลตามช้า  -> เพิ่ม filterBeta (เช่น 2000) ก่อน อย่าเพิ่ม filterMinCF
                      เพราะ beta ลดความหน่วงตอนขยับโดยไม่เพิ่มการสั่นตอนอยู่นิ่ง

    missTolerance: 10 (เดิม 5) = จำนวนเฟรมที่หา target ไม่เจอติดกันก่อนจะถือว่าหลุด
    เพิ่มขึ้นเพื่อให้ทนต่อการบังหรือมุมกล้องต่ำชั่วขณะได้ดีขึ้น
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind?v=3; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 10;"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <!--
        ?v=3 คือตัวกันแคช GitHub Pages ส่งหัว Cache-Control: max-age=600
        มือถือจึงเก็บไฟล์เดิมไว้ 10 นาที ถ้าเปลี่ยนไฟล์ใน assets/ แล้วเครื่องยัง
        เห็นของเก่า ให้บวกเลข v ขึ้น 1 ทั้งที่นี่และที่ imageTargetSrc ด้านบน
        แล้ว push ใหม่ เครื่องจะถูกบังคับให้โหลดของใหม่ทันที
      -->
      <a-asset-item id="model" src="./assets/model.glb?v=3"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- target 0 = ภาพเป้าหมายลำดับแรกในไฟล์ targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetEntity">
      <!--
        ระนาบ target ของ MindAR กว้าง 1 หน่วยพอดี (สูงตามสัดส่วนภาพ)
        โดยมีจุดกึ่งกลางภาพอยู่ที่ 0,0,0 และแกน +Z ชี้พุ่งออกจากกระดาษ

        ขนาดจริงของ model.glb ที่ถอดรหัสจาก vertex โดยตรง (ไม่ใช่ค่า min/max
        ที่เขียนกำกับไว้ในไฟล์ ซึ่ง ImageToStl.com เขียนสลับแกนไว้ผิด):
          min (76.33, 0, -964.14)   max (6032.80, 1029.53, 362.45)
          ขนาด X=5956.47  Y=1029.53  Z=1326.58
        โมเดลเป็นแบบ Y-up ฐานอยู่ที่ Y=0

        rotation 90 0 0  หมุนแกนขึ้นของโมเดล (+Y) ให้ไปตรงกับ +Z ที่พุ่งออกจาก
                 กระดาษ ไม่งั้นอาคารจะนอนหงายและจมลงไปหลังกระดาษ
        scale    0.000168 = 1.0 / 5956.47  ให้อาคารกว้างเท่าความกว้างภาพพอดี
        position ชดเชยให้อาคารมาอยู่กึ่งกลาง = -(จุดกึ่งกลางหลังหมุน x scale)
                 แกน Z ปล่อยเป็น 0 เพราะหลังหมุนแล้วฐานอาคารอยู่ที่ Z=0 พอดี
      -->
      <a-gltf-model
        rotation="90 0 0"
        position="-0.5132 -0.0505 0"
        scale="0.000168 0.000168 0.000168"
        src="#model"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
  </div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const foundBadge = document.getElementById('foundBadge');
    const sceneEl = document.querySelector('a-scene');
    const targetEntity = document.getElementById('targetEntity');

    const showError = (msg) => {
      startScreen.style.display = 'flex';
      hint.style.display = 'none';
      startScreen.querySelector('p').textContent = msg;
      startBtn.textContent = 'ลองอีกครั้ง';
    };

    /*
      ---- คงโมเดลไว้เมื่อ target หลุดจากเฟรม ----

      ปกติ MindAR จะซ่อนโมเดลทันทีที่หาภาพไม่เจอ โดยเมธอด updateWorldMatrix
      ของ component "mindar-image-target" ทำแบบนี้:
          this.el.object3D.visible = worldMatrix !== null;
          if (worldMatrix === null) { this.el.object3D.matrix = this.invisibleMatrix; return; }

      เราแทนที่เมธอดนี้ให้จำท่าล่าสุดไว้ แล้วตอนหาไม่เจอก็ค้างโมเดลไว้ที่ท่านั้น
      แทนการซ่อน ผู้ใช้จึงยังเห็นอาคารอยู่แม้ก้มกล้องต่ำจนภาพหลุดเฟรม
      พอเล็งกลับไปเจอภาพอีกครั้ง ระบบจะกลับไปติดตามตามปกติเอง

      ข้อจำกัดที่ต้องเข้าใจ: MindAR ตรึงกล้องไว้ที่จุดกำเนิดแล้วขยับโมเดลแทน
      ช่วงที่ค้างไว้ โมเดลจึงติดอยู่กับ "หน้าจอ" ไม่ใช่ติดอยู่กับโต๊ะ ขยับมือถือ
      แล้วโมเดลจะขยับตามไปด้วย การเดินดูรอบๆ ของจริงต้องใช้ world tracking
      (ARCore/ARKit) ซึ่ง MindAR ไม่มี

      หมายเหตุ: นี่คือการแทนที่เมธอดภายในของ MindAR 1.2.5 ถ้าอัปเกรดเวอร์ชัน
      ต้องตรวจสอบก่อนว่า updateWorldMatrix ยังทำงานแบบเดิมอยู่หรือไม่
    */
    const targetProto = AFRAME.components['mindar-image-target'].Component.prototype;

    targetProto.updateWorldMatrix = function (worldMatrix) {
      this.el.emit('targetUpdate');

      if (worldMatrix !== null) {
        const m = new AFRAME.THREE.Matrix4();
        m.elements = worldMatrix;
        m.multiply(this.postMatrix);
        this.el.object3D.matrix = m;
        this.el.object3D.visible = true;
        this.lastKnownMatrix = m.clone();
        if (!this.isTracking) {
          this.isTracking = true;
          this.el.emit('targetFound');
        }
        return;
      }

      if (this.isTracking) {
        this.isTracking = false;
        this.el.emit('targetLost');
      }

      if (this.lastKnownMatrix) {
        // เคยสแกนเจอแล้ว -> ค้างไว้ที่ท่าล่าสุด
        this.el.object3D.visible = true;
        this.el.object3D.matrix = this.lastKnownMatrix;
      } else {
        // ยังไม่เคยเจอเลย -> ซ่อนตามเดิม
        this.el.object3D.visible = false;
        this.el.object3D.matrix = this.invisibleMatrix;
      }
    };

    // MindAR ลงทะเบียน system ไว้ในชื่อ "mindar-image-system"
    // (ส่วน "mindar-image" คือชื่อ component ที่ใส่ไว้บน <a-scene>)
    // และ start() ต้องเรียกหลัง renderstart เท่านั้น เพราะข้างในอ้างถึง sceneEl.parentNode
    let renderStarted = false;
    let startRequested = false;

    const startAR = () => {
      const arSystem = sceneEl.systems['mindar-image-system'];
      if (!arSystem) {
        showError('โหลดระบบ AR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
        return;
      }
      try {
        arSystem.start(); // เปิดกล้องและเริ่มสแกนหาเป้าหมาย
      } catch (e) {
        console.error(e);
        showError('เปิดกล้องไม่สำเร็จ กรุณาอนุญาตสิทธิ์กล้อง และเปิดหน้านี้ผ่าน HTTPS');
      }
    };

    sceneEl.addEventListener('renderstart', () => {
      renderStarted = true;
      if (startRequested) startAR();
    });

    // MindAR แจ้ง error ของกล้องผ่าน event นี้ ไม่ใช่การ throw
    sceneEl.addEventListener('arError', () => {
      showError('เปิดกล้องไม่สำเร็จ กรุณาอนุญาตสิทธิ์กล้อง และเปิดหน้านี้ผ่าน HTTPS');
    });

    startBtn.addEventListener('click', () => {
      startScreen.style.display = 'none';
      hint.style.display = 'block';
      startRequested = true;
      // ถ้า scene พร้อมแล้วเริ่มเลย ถ้ายังไม่พร้อมจะถูกเรียกตอน renderstart
      if (renderStarted) startAR();
    });

    // เคยสแกนเจอแล้วหรือยัง ใช้แยกข้อความว่า "ยังหาไม่เจอ" กับ "ตรึงไว้ชั่วคราว"
    let hasScannedOnce = false;

    targetEntity.addEventListener('targetFound', () => {
      hasScannedOnce = true;
      hint.style.display = 'none';
      foundBadge.textContent = 'กำลังติดตามภาพ ✓';
      foundBadge.style.display = 'block';
    });

    targetEntity.addEventListener('targetLost', () => {
      foundBadge.style.display = 'none';
      hint.textContent = hasScannedOnce
        ? 'ตรึงโมเดลไว้ชั่วคราว — เล็งกลับไปที่ภาพเพื่อติดตามต่อ'
        : 'กำลังมองหาภาพบนกระดาษ...';
      hint.style.display = 'block';
    });
  </script>
</body>
</html>
